[package]
name = "rahti-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Read-only Model Context Protocol server for Rahti projects"

[dependencies]
rmcp = { version = "3.1.4", default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["io-std", "macros", "rt-multi-thread"] }

[dev-dependencies]
rmcp = { version = "3.1.4", default-features = false, features = ["client", "macros", "server", "transport-io"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt-multi-thread"] }
