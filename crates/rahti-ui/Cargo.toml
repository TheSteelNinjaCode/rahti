# A component library, as a third-party crate would be written.
#
# Nothing here is privileged: it depends on `rahti` the way any crate off
# crates.io would, and the app depends on it by name. It lives in this
# workspace so the packaging story has something to be tested against.
[package]
name = "rahti-ui"
description = "Example component library for Rahti, installable with cargo add."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The runtime `html!` expands into. A component library needs nothing else —
# `#[component]` and `html!` are re-exported from here.
rahti.workspace = true
# The types an `#[rpc]` answers with.
serde = { version = "1", features = ["derive"] }

# Tailwind is told to scan this directory, so the classes written below reach
# the app's stylesheet. Without it a library renders correct markup with no CSS
# behind it: its source sits in the cargo registry, which no `@source` in the
# app covers. Read by `rahti-build`'s `deps.rs`; cargo itself ignores it.
[package.metadata.rahti]
components = "src"
# Plain CSS for apps that do not run Tailwind. A library declaring only
# `components` is Tailwind-only, and `css.engine = "plain"` refuses it rather
# than letting it render unstyled — declaring both is what makes this crate
# installable either way.
stylesheet = "ui.css"

