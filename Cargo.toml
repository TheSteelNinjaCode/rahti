# The Rahti framework workspace. The crates under `crates/` are the
# framework; an application is scaffolded out of them with `cargo rahti new`,
# the way `npx create-next-app` scaffolds a Next.js project. No application
# lives in this repository.
[workspace]
resolver = "3"
members = [
    "crates/cargo-rahti",
    "crates/rahti",
    "crates/rahti-build",
    "crates/rahti-macros",
    "crates/rahti-ui",
]

# Inherited by every publishable crate with `field.workspace = true`.
#
# One version across the framework, deliberately. `html!` expands to paths in
# `rahti`, and `rahti-build` writes code calling functions in it — a project
# that mixed versions would fail to compile with an error naming neither
# crate. Releasing them in lockstep makes the mismatch impossible to reach.
[workspace.package]
version = "0.0.16"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeffersonabraham/rahti"
# `edition = "2024"` would put the floor at 1.85, but `rahti-macros` reads
# `proc_macro::Span::file()` to locate a route file, and that was stabilized
# in 1.88 — so 1.88 is the real floor. Naming it means cargo says so rather
# than rustc failing halfway through a dependency.
rust-version = "1.88"

# One place to bump when the framework releases. `version` alongside `path`
# is what makes these publishable: cargo uses the path locally and the
# version once the crate is on crates.io, and a path-only dependency cannot
# be published at all.
[workspace.dependencies]
rahti = { path = "crates/rahti", version = "0.0.16" }
rahti-build = { path = "crates/rahti-build", version = "0.0.16" }
rahti-macros = { path = "crates/rahti-macros", version = "0.0.16" }
